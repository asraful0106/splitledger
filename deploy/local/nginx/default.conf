server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hitting the published port directly should land on the app.
    location = / {
        return 302 /ap/splitledger/;
    }

    # The prefix location below needs its trailing slash, so catch the bare path.
    location = /ap/splitledger {
        return 302 /ap/splitledger/;
    }

    # The bundle is built with base=/ap/splitledger/, so every URL it emits carries
    # that prefix while the files sit at the dist root. Strip it before lookup.
    location /ap/splitledger/assets/ {
        rewrite ^/ap/splitledger/(.*)$ /$1 break;
        expires 1y;
    }

    location = /ap/splitledger/sw.js {
        rewrite ^/ap/splitledger/sw\.js$ /sw.js break;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /ap/splitledger/manifest.webmanifest {
        rewrite ^/ap/splitledger/manifest\.webmanifest$ /manifest.webmanifest break;
        add_header Cache-Control "no-cache" always;
    }

    # Deep links fall back to the shell; the router handles the rest from there.
    # The fallback is a named location because a plain /index.html would be an
    # internal redirect that re-enters matching and lands on `location /` below.
    location /ap/splitledger/ {
        rewrite ^/ap/splitledger/(.*)$ /$1 break;
        try_files $uri @splitledger_shell;
        add_header Cache-Control "no-cache" always;
    }

    location @splitledger_shell {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache" always;
    }

    # Same origin as the app, and at the API's own path: the refresh cookie is
    # scoped to Path=/api/v1/auth, so the browser only sends it to /api/v1/... .
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
