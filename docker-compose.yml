# Production stack: the API and the web app. The database is external and is
# reached through DATABASE_URL (see docs/deployment.md); there is deliberately
# no Postgres service here.
#
#   cp .env.production.example .env.production   # then fill in real values
#   docker compose build
#   docker compose run --rm api node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations -j sql up
#   docker compose up -d

name: splitledger

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: splitledger-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: splitledger-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
