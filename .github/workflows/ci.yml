name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitledger
          POSTGRES_PASSWORD: splitledger
          POSTGRES_DB: splitledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://splitledger:splitledger@localhost:5432/splitledger
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api migrate up

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm audit --audit-level high
